<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdul Hakim - Bio Link</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Arial', sans-serif; }

  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; color: #fff;
  }

  main.card {
    background: rgba(0,0,0,0.5);
    padding: 30px 25px;
    border-radius: 25px;
    text-align: center;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
  }

  .avatar img {
    width: 130px; height: 130px;
    border-radius: 50%;
    object-fit: cover; margin-bottom: 15px;
    border: 3px solid rgba(255,255,255,0.5);
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .avatar img:hover {
    transform: scale(1.08) rotate(3deg);
    box-shadow: 0 0 25px #00ffff, 0 0 35px #ff00ff;
  }

  h1#profileName {
    font-size: 28px;
    margin-bottom: 5px;
    text-shadow: 0 0 10px #fff;
  }

  p.subtitle {
    font-size: 15px;
    opacity: 0.9;
    margin-bottom: 25px;
    text-shadow: 0 0 5px #fff;
  }

  .links {
    display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;
  }

  /* Glassmorphism Buttons with Gradient Animation */
  .link-btn {
    display: flex; align-items: center;
    padding: 12px 15px;
    border-radius: 15px;
    text-decoration: none;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.3s;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    cursor: pointer;
  }

  .link-btn::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff);
    background-size: 400% 400%;
    filter: blur(15px);
    opacity: 0.5;
    z-index: 0;
    border-radius: 15px;
    animation: gradientMove 8s linear infinite;
    transition: opacity 0.3s;
  }

  .link-btn:hover::before { opacity: 0.7; }
  .link-btn > * { position: relative; z-index: 1; } /* keep text/icon above gradient */

  @keyframes gradientMove { 0% { background-position:0% 50%; } 50% { background-position:100% 50%; } 100% { background-position:0% 50%; } }

  .link-btn:hover { transform: scale(1.05); box-shadow: 0 6px 15px rgba(0,0,0,0.3); }

  /* Click Pulse Effect (dynamic color) */
  .pulse {
    position: absolute;
    left: 50%; top: 50%;
    width: 10px; height: 10px;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0.7;
    pointer-events: none;
    animation: pulseAnim 0.5s ease-out forwards;
  }

  @keyframes pulseAnim {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0.7; }
    70% { transform: translate(-50%, -50%) scale(3); opacity: 0.3; }
    100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
  }

  .link-icon { font-size: 22px; margin-right: 12px; width:24px; text-align:center; }
  .link-btn .small { font-size: 12px; opacity: 0.8; display: block; line-height: 1.2; }

  footer { font-size: 12px; opacity: 0.7; }

  @media(max-width:480px){
    main.card { padding: 20px; }
    h1#profileName { font-size: 24px; }
    .avatar img { width: 110px; height: 110px; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="avatar">
    <img id="avatarImg" src="1763026669531.png" alt="Abdul Hakim">
  </div>
  <h1 id="profileName">Abdul Hakim</h1>
  <p class="subtitle" id="profileBio">Developer • Content Creator • Tech Enthusiast</p>

  <div class="links" id="linksContainer"></div>
  <footer>Made with ❤️ by MASTER-404</footer>
</main>

<script>
const siteData = {
  name: 'Abdul Hakim',
  bio: 'Developer • Content Creator • Tech Enthusiast',
  avatar: '1763026669531.png',
  links: [
    { title: 'Facebook', url: 'https://facebook.com/Abdulhakimbd16', icon: 'fab fa-facebook-f', subtitle: 'Follow on Facebook', color: '#1877F2' },
    { title: 'Instagram', url: 'https://instagram.com/Abdulhakimbd16', icon: 'fab fa-instagram', subtitle: 'Follow on Instagram', color: '#E1306C' },
    { title: 'TikTok', url: 'https://www.tiktok.com/@abdul.hakim.69', icon: 'fab fa-tiktok', subtitle: 'Watch my TikTok videos', color: '#010101' },
    { title: 'GitHub', url: 'https://github.com/master-404', icon: 'fab fa-github', subtitle: 'Explore my projects', color: '#333' },
    { title: 'Telegram', url: 'https://t.me/AbdulHakimbd0', icon: 'fab fa-telegram-plane', subtitle: 'Join me on Telegram', color: '#0088cc' },
    { title: 'WhatsApp', url: 'https://wa.me/9710589391569', icon: 'fab fa-whatsapp', subtitle: 'Chat on WhatsApp', color: '#25D366' },
    { title: 'LinkedIn', url: 'https://www.linkedin.com/in/abdul-hakim-4953b6396/', icon: 'fab fa-linkedin-in', subtitle: 'Connect on LinkedIn', color: '#0A66C2' },
    { title: 'About Me', url: 'about.html', icon: 'fas fa-user', subtitle: 'Learn more about me', color: '#FF00FF' }
  ]
}

document.getElementById('profileName').textContent = siteData.name
document.getElementById('profileBio').textContent = siteData.bio
document.getElementById('avatarImg').src = siteData.avatar

const linksContainer = document.getElementById('linksContainer')
siteData.links.forEach(l => {
  const a = document.createElement('a')
  a.className = 'link-btn'
  a.href = l.url
  a.target = '_blank'
  a.rel = 'noopener noreferrer'
  a.dataset.color = l.color
  a.innerHTML = `<div class="link-icon"><i class="${l.icon}"></i></div>
                 <div style="text-align:left">
                   <div>${l.title}</div>
                   <div class="small">${l.subtitle}</div>
                 </div>`

  // Click pulse effect
  a.addEventListener('click', (e) => {
    const pulse = document.createElement('span')
    pulse.className = 'pulse'
    pulse.style.backgroundColor = l.color
    a.appendChild(pulse)
    setTimeout(() => { pulse.remove() }, 500)
  })

  linksContainer.appendChild(a)
})
</script>
</body>
</html>
