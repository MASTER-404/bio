<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdul Hakim - Bio Link</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Cyber Backgrounds */
        .cyber-bg {
            position: fixed;
            width: 100%; height: 100%;
            top: 0; left: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 75, 145, 0.3), transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(0, 245, 212, 0.2), transparent 50%);
            z-index: 0;
        }
        
        .grid-bg {
            position: fixed;
            width: 100%; height: 100%;
            top: 0; left: 0;
            background-image: 
                linear-gradient(rgba(79, 172, 254, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79, 172, 254, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .stars { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 2; pointer-events: none; }
        .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; animation: twinkle 3s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

        /* Main Card */
        main.card {
            background: rgba(15, 15, 35, 0.85);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 40px;
            text-align: center;
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 3;
            border: 1px solid rgba(79, 172, 254, 0.3);
            animation: cardGlow 3s ease-in-out infinite;
        }
        
        @keyframes cardGlow {
            0%, 100% { box-shadow: 0 20px 80px rgba(79, 172, 254, 0.3); }
            50% { box-shadow: 0 20px 100px rgba(255, 75, 145, 0.4); }
        }
        
        /* Animated Logo Text */
        .logo-text {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
            margin-bottom: 25px;
            perspective: 1000px;
        }
        
        .logo-text span {
            font-size: 48px;
            font-weight: 900;
            display: inline-block;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-style: preserve-3d;
        }
        
        .logo-text span:hover {
            transform: scale(1.4) translateY(-15px) rotateY(360deg);
        }
        
        /* M - Bounce */
        .logo-text span:nth-child(1) {
            font-family: 'Impact', sans-serif;
            background: linear-gradient(135deg, #ff0080, #ff4081);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: bounceAnim 2s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #ff0080);
        }
        @keyframes bounceAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        /* A - Rotate */
        .logo-text span:nth-child(2) {
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #00ff88, #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rotateAnim 3s linear infinite;
            filter: drop-shadow(0 0 15px #00ff88);
        }
        @keyframes rotateAnim {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(15deg); }
        }
        
        /* S - Wave */
        .logo-text span:nth-child(3) {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: waveAnim 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #4facfe);
        }
        @keyframes waveAnim {
            0%, 100% { transform: translateY(0) skewX(0deg); }
            50% { transform: translateY(-10px) skewX(8deg); }
        }
        
        /* T - Pulse */
        .logo-text span:nth-child(4) {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ffdd00, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulseAnim 1.8s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #ffdd00);
        }
        @keyframes pulseAnim {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        /* E - Flip */
        .logo-text span:nth-child(5) {
            font-family: 'Verdana', sans-serif;
            background: linear-gradient(135deg, #ff4081, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flipAnim 4s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #ff4081);
        }
        @keyframes flipAnim {
            0%, 100% { transform: rotateY(0deg); }
            50% { transform: rotateY(180deg); }
        }
        
        /* R - Swing */
        .logo-text span:nth-child(6) {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #7c4dff, #9c27ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: swingAnim 2.2s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #7c4dff);
            transform-origin: top center;
        }
        @keyframes swingAnim {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-10deg); }
        }
        
        /* 4 - Wobble */
        .logo-text span:nth-child(7) {
            font-family: 'Comic Sans MS', cursive;
            background: linear-gradient(135deg, #ff6b00, #ff8533);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: wobbleAnim 2s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #ff6b00);
        }
        @keyframes wobbleAnim {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(5deg) translateX(3px); }
            75% { transform: rotate(-5deg) translateX(-3px); }
        }
        
        /* 0 - Zoom */
        .logo-text span:nth-child(8) {
            font-family: 'Impact', sans-serif;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: zoomAnim 2.8s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #00d4ff);
        }
        @keyframes zoomAnim {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }
        
        /* 4 - Shake */
        .logo-text span:nth-child(9) {
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #4facfe, #ff4b91);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shakeAnim 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #4facfe);
        }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            10%, 30% { transform: translateX(-3px); }
            20%, 40% { transform: translateX(3px); }
            50% { transform: translateX(0); }
        }

        /* Profile Section */
        .avatar-wrapper { position: relative; display: inline-block; margin-bottom: 20px; }
        .avatar-glow {
            position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%; background: linear-gradient(45deg, #4facfe, #ff4b91);
            animation: rotate 3s linear infinite; filter: blur(5px);
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .avatar-wrapper img {
            width: 150px; height: 150px; border-radius: 50%;
            border: 4px solid #000; position: relative; z-index: 1; object-fit: cover;
        }

        h1#profileName { color: #fff; font-size: 32px; margin-bottom: 5px; }
        p.subtitle { color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 30px; }

        /* Links Grid */
        .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .link-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(79, 172, 254, 0.3);
            border-radius: 15px; padding: 15px 10px;
            text-decoration: none; color: #fff;
            transition: 0.3s; display: flex; flex-direction: column; align-items: center;
        }
        .link-btn:hover { transform: translateY(-5px); background: rgba(79, 172, 254, 0.2); border-color: #4facfe; }
        .link-icon { font-size: 28px; margin-bottom: 8px; }
        .link-title { font-size: 13px; font-weight: 700; }
        .link-subtitle { font-size: 9px; opacity: 0.6; margin-top: 2px; }

        /* Button Colors */
        .facebook:hover { color: #1877F2; border-color: #1877F2; }
        .instagram:hover { color: #E1306C; border-color: #E1306C; }
        .tiktok:hover { color: #fff; border-color: #fff; }
        .youtube:hover { color: #FF0000; border-color: #FF0000; }
        .github:hover { color: #fff; border-color: #fff; }
        .telegram:hover { color: #0088cc; border-color: #0088cc; }
        .whatsapp:hover { color: #25D366; border-color: #25D366; }
        .linkedin:hover { color: #0A66C2; border-color: #0A66C2; }
        .about:hover { color: #4facfe; border-color: #4facfe; }

        footer { margin-top: 30px; color: rgba(255,255,255,0.3); font-size: 12px; }

        /* Music Floating Button */
        .music-btn {
            position: fixed; bottom: 25px; right: 25px;
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #4facfe, #ff4b91);
            color: white; border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            box-shadow: 0 5px 25px rgba(79, 172, 254, 0.5);
            transition: all 0.3s;
        }
        
        .music-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 35px rgba(79, 172, 254, 0.7);
        }
        
        .music-btn.playing {
            animation: musicPulse 1s ease-in-out infinite;
        }
        
        @keyframes musicPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @media(max-width:600px) {
            .links { grid-template-columns: repeat(2, 1fr); }
            main.card { padding: 40px 25px; }
            .logo-text span { font-size: 38px; }
            .music-btn { width: 50px; height: 50px; font-size: 20px; bottom: 20px; right: 20px; }
        }
        
        @media(max-width:400px) {
            .links { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="cyber-bg"></div>
<div class="grid-bg"></div>
<div class="stars" id="starsContainer"></div>

<main class="card">
    <div class="logo-text">
        <span>M</span>
        <span>A</span>
        <span>S</span>
        <span>T</span>
        <span>E</span>
        <span>R</span>
        <span>4</span>
        <span>0</span>
        <span>4</span>
    </div>
    
    <div class="avatar-wrapper">
        <div class="avatar-glow"></div>
        <img src="1763026669531.png" alt="Abdul Hakim">
    </div>
    
    <h1 id="profileName">Abdul Hakim</h1>
    <p class="subtitle">Developer • Content Creator • Tech Enthusiast</p>
    
    <div class="links" id="linksContainer"></div>
    
    <footer>Made with ❤️ by MASTER404</footer>
</main>

<button class="music-btn" id="musicBtn">
    <i class="fas fa-music"></i>
</button>

<audio id="bgMusic" loop>
    <source src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3" type="audio/mpeg">
</audio>

<script>
const siteData = {
    links: [
        {title: 'Facebook', url: 'https://facebook.com/Abdulhakimbd16', icon: 'fab fa-facebook-f', subtitle: 'Follow', class: 'facebook'},
        {title: 'Instagram', url: 'https://instagram.com/Abdulhakimbd16', icon: 'fab fa-instagram', subtitle: 'Follow', class: 'instagram'},
        {title: 'TikTok', url: 'https://www.tiktok.com/@abdul.hakim.69', icon: 'fab fa-tiktok', subtitle: 'Watch', class: 'tiktok'},
        {title: 'YouTube', url: 'https://www.youtube.com/@YourChannel', icon: 'fab fa-youtube', subtitle: 'Subscribe', class: 'youtube'},
        {title: 'GitHub', url: 'https://github.com/master-404', icon: 'fab fa-github', subtitle: 'Projects', class: 'github'},
        {title: 'Telegram', url: 'https://t.me/AbdulHakimbd0', icon: 'fab fa-telegram-plane', subtitle: 'Join', class: 'telegram'},
        {title: 'WhatsApp', url: 'https://wa.me/9710589391569', icon: 'fab fa-whatsapp', subtitle: 'Chat', class: 'whatsapp'},
        {title: 'LinkedIn', url: 'https://www.linkedin.com/in/abdul-hakim-4953b6396/', icon: 'fab fa-linkedin-in', subtitle: 'Connect', class: 'linkedin'},
        {title: 'About', url: 'about.html', icon: 'fas fa-user', subtitle: 'Info', class: 'about'}
    ]
};

// Create Stars
const starsContainer = document.getElementById('starsContainer');
for(let i=0; i<30; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    starsContainer.appendChild(star);
}

// Render Links
const container = document.getElementById('linksContainer');
siteData.links.forEach(link => {
    const a = document.createElement('a');
    a.className = `link-btn ${link.class}`;
    a.href = link.url;
    a.target = '_blank';
    a.innerHTML = `
        <i class="${link.icon} link-icon"></i>
        <span class="link-title">${link.title}</span>
        <span class="link-subtitle">${link.subtitle}</span>
    `;
    container.appendChild(a);
});

// Music Control
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');
let isPlaying = false;

musicBtn.addEventListener('click', () => {
    if (isPlaying) {
        bgMusic.pause();
        musicBtn.innerHTML = '<i class="fas fa-music"></i>';
        musicBtn.classList.remove('playing');
    } else {
        bgMusic.volume = 0.2;
        bgMusic.play();
        musicBtn.innerHTML = '<i class="fas fa-pause"></i>';
        musicBtn.classList.add('playing');
    }
    isPlaying = !isPlaying;
});
</script>

</body>
</html>
