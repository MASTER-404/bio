<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdul Hakim - Bio Link</title>
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', Arial, sans-serif; }
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #fff;
  }
  main.card {
    background: rgba(0,0,0,0.55);
    padding: 30px 25px;
    border-radius: 25px;
    text-align: center;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
  }
  .main-logo {
    width: 100%;
    max-width: 340px;
    display: block;
    margin: 0 auto 25px;
    filter: drop-shadow(0 0 20px #00e5ff);
    animation: logoFloat 4s ease-in-out infinite;
  }
  @keyframes logoFloat { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
  .top-line { height:4px; width:90%; margin:0 auto 20px; background: linear-gradient(90deg, #00e5ff, #00b0ff, #00e5ff); box-shadow:0 0 15px rgba(0,229,255,0.8); position:relative; overflow:hidden; border-radius:2px; }
  .top-line::after { content:''; position:absolute; top:0; left:-30%; height:100%; width:30%; background: rgba(255,255,255,0.8); box-shadow:0 0 20px #fff; animation: lineScan 2s linear infinite; }
  @keyframes lineScan { 0% { left:-30%; } 100% { left:100%; } }
  .avatar img { width:140px; height:140px; border-radius:50%; object-fit:cover; margin-bottom:18px; border:4px solid rgba(0,229,255,0.6); transition: all 0.4s; box-shadow: 0 0 20px rgba(0,229,255,0.4); }
  .avatar img:hover { transform: scale(1.1) rotate(5deg); box-shadow: 0 0 30px #00ffff, 0 0 50px #00e5ff; }
  h1#profileName { font-size:30px; margin-bottom:6px; text-shadow:0 0 12px #00e5ff; }
  p.subtitle { font-size:16px; opacity:0.9; margin-bottom:30px; }
  .links { display:flex; flex-direction:column; gap:16px; margin-bottom:20px; }
  .link-btn { display:flex; align-items:center; padding:14px 18px; border-radius:18px; text-decoration:none; color:#fff; font-weight:600; font-size:16px; position:relative; overflow:hidden; transition: all 0.3s; background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border:1px solid rgba(0,229,255,0.7); box-shadow:0 0 15px rgba(0,229,255,0.4); }
  .link-btn::before { content:''; position:absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent); transform: translateX(-100%); transition: transform 0.6s; }
  .link-btn:hover::before { transform: translateX(100%); }
  .link-btn:hover { transform: translateY(-4px) scale(1.04); box-shadow:0 0 25px rgba(0,229,255,0.7); }
  .link-icon { font-size:24px; margin-right:15px; width:28px; text-align:center; }
  .link-btn .small { font-size:13px; opacity:0.85; display:block; margin-top:4px; }
  footer { font-size:13px; opacity:0.7; margin-top:10px; }
  @media(max-width:480px){ main.card{padding:25px 20px;} h1#profileName{font-size:26px;} .avatar img{width:120px;height:120px;} .main-logo{max-width:280px;} .link-btn{font-size:15px; padding:12px 16px;} }
</style>
</head>
<body>
<main class="card">
  <img src="https://raw.githubusercontent.com/MASTER-404/bio/main/logo.png" alt="MASTER404 Logo" class="main-logo">
  <div class="top-line"></div>
  <div class="avatar">
    <img id="avatarImg" src="1763026669531.png" alt="Abdul Hakim">
  </div>
  <h1 id="profileName">Abdul Hakim</h1>
  <p class="subtitle" id="profileBio">Developer • Content Creator • Tech Enthusiast</p>
  <div class="links" id="linksContainer"></div>
  <footer>Made with ❤️ by MASTER404</footer>
</main>

<audio id="bgMusic" loop>
  <source src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3" type="audio/mpeg">
</audio>
<audio id="clickSound">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3" type="audio/mpeg">
</audio>

<script>
const siteData = {
  name:'Abdul Hakim',
  bio:'Developer • Content Creator • Tech Enthusiast',
  avatar:'1763026669531.png',
  links:[
    {title:'Facebook', url:'https://facebook.com/Abdulhakimbd16', icon:'fab fa-facebook-f', subtitle:'Follow on Facebook', color:'#1877F2'},
    {title:'Instagram', url:'https://instagram.com/Abdulhakimbd16', icon:'fab fa-instagram', subtitle:'Follow on Instagram', color:'#E1306C'},
    {title:'TikTok', url:'https://www.tiktok.com/@abdul.hakim.69', icon:'fab fa-tiktok', subtitle:'Watch my TikTok videos', color:'#000000'},
    {title:'YouTube', url:'https://www.youtube.com/@YourChannel', icon:'fab fa-youtube', subtitle:'Subscribe on YouTube', color:'#FF0000'}, // <-- নতুন লিঙ্ক, তোমার চ্যানেল লিঙ্ক দিয়ে চেঞ্জ করো
    {title:'GitHub', url:'https://github.com/master-404', icon:'fab fa-github', subtitle:'Explore my projects', color:'#333'},
    {title:'Telegram', url:'https://t.me/AbdulHakimbd0', icon:'fab fa-telegram-plane', subtitle:'Join me on Telegram', color:'#0088cc'},
    {title:'WhatsApp', url:'https://wa.me/9710589391569', icon:'fab fa-whatsapp', subtitle:'Chat on WhatsApp', color:'#25D366'},
    {title:'LinkedIn', url:'https://www.linkedin.com/in/abdul-hakim-4953b6396/', icon:'fab fa-linkedin-in', subtitle:'Connect on LinkedIn', color:'#0A66C2'},
    {title:'About Me', url:'about.html', icon:'fas fa-user', subtitle:'Learn more about me', color:'#00e5ff'}
  ]
};

document.getElementById('profileName').textContent = siteData.name;
document.getElementById('profileBio').textContent = siteData.bio;
document.getElementById('avatarImg').src = siteData.avatar;

const linksContainer = document.getElementById('linksContainer');
const clickSound = document.getElementById('clickSound');
const bgMusic = document.getElementById('bgMusic');

siteData.links.forEach(link => {
  const a = document.createElement('a');
  a.className = 'link-btn';
  a.href = link.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.innerHTML = `
    <div class="link-icon"><i class="${link.icon}"></i></div>
    <div style="text-align:left">
      <div>${link.title}</div>
      <div class="small">${link.subtitle}</div>
    </div>
  `;
  a.addEventListener('click', () => {
    clickSound.currentTime = 0;
    clickSound.play().catch(() => {}); // এরর এড়ানো
  });
  linksContainer.appendChild(a);
});

// Background music: প্রথম ইউজার ইন্টারঅ্যাকশনেই প্লে
document.body.addEventListener('click', () => {
  if (bgMusic.paused) {
    bgMusic.volume = 0.15; // আরও কম ভলিউম
    bgMusic.play().catch(() => {});
  }
}, { once: true });
</script>
</body>
</html>
