<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MASTER404 | Abdul Hakim</title>

<meta name="description" content="Abdul Hakim | Developer • Content Creator • Tech Enthusiast | MASTER404">
<meta property="og:title" content="MASTER404 - Abdul Hakim">
<meta property="og:description" content="Developer • Content Creator • Tech Enthusiast">
<meta property="og:image" content="./assets/avatar.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Outfit',sans-serif;
background:#050505;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
overflow-x:hidden
}
.cyber-bg,.grid-bg,.stars{position:fixed;inset:0}
.cyber-bg{
background:
radial-gradient(circle at 20% 50%,rgba(120,119,198,.3),transparent 50%),
radial-gradient(circle at 80% 80%,rgba(255,75,145,.3),transparent 50%),
radial-gradient(circle at 40% 20%,rgba(0,245,212,.2),transparent 50%);
z-index:0
}
.grid-bg{
background-image:
linear-gradient(rgba(79,172,254,.1) 1px,transparent 1px),
linear-gradient(90deg,rgba(79,172,254,.1) 1px,transparent 1px);
background-size:50px 50px;
animation:gridMove 20s linear infinite;
z-index:1
}
@keyframes gridMove{to{transform:translate(50px,50px)}}
.stars{z-index:2;pointer-events:none}
.star{width:2px;height:2px;background:#fff;border-radius:50%;position:absolute;animation:twinkle 3s infinite}
@keyframes twinkle{50%{opacity:1}}

main.card{
background:rgba(15,15,35,.85);
backdrop-filter:blur(20px);
padding:50px 40px;
border-radius:40px;
text-align:center;
max-width:480px;
width:100%;
z-index:3;
border:1px solid rgba(79,172,254,.3)
}

.logo-text{display:flex;justify-content:center;gap:3px;margin-bottom:25px}
.logo-text span{
font-size:48px;
font-weight:900;
transition:.4s;
filter:drop-shadow(0 0 15px currentColor)
}
.logo-text span:hover{transform:scale(1.3) translateY(-10px)}

.avatar-wrapper{position:relative;margin-bottom:20px}
.avatar-glow{
position:absolute;inset:-5px;
border-radius:50%;
background:linear-gradient(45deg,#4facfe,#ff4b91);
filter:blur(6px);
animation:spin 3s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar-wrapper img{
width:150px;height:150px;
border-radius:50%;
border:4px solid #000;
position:relative;
z-index:1;
object-fit:cover
}

h1{color:#fff;font-size:32px}
.subtitle{color:rgba(255,255,255,.7);margin-bottom:30px}

.links{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px
}
.link-btn{
background:rgba(255,255,255,.05);
border:1px solid rgba(79,172,254,.3);
border-radius:15px;
padding:15px 10px;
text-decoration:none;
color:#fff;
transition:.3s;
display:flex;
flex-direction:column;
align-items:center
}
.link-btn:hover{
transform:translateY(-5px);
background:rgba(79,172,254,.2)
}
.link-icon{font-size:26px;margin-bottom:6px}
.link-title{font-size:13px;font-weight:700}
.link-subtitle{font-size:9px;opacity:.6}

footer{margin-top:30px;color:rgba(255,255,255,.3);font-size:12px}

.music-btn{
position:fixed;
bottom:25px;
right:25px;
width:60px;
height:60px;
border-radius:50%;
background:linear-gradient(135deg,#4facfe,#ff4b91);
color:#fff;
border:none;
font-size:22px;
cursor:pointer;
z-index:999
}

@media(max-width:600px){
.links{grid-template-columns:repeat(2,1fr)}
.logo-text span{font-size:38px}
}
@media(max-width:400px){
.links{grid-template-columns:1fr}
}

@media(prefers-reduced-motion:reduce){
*{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<div class="cyber-bg"></div>
<div class="grid-bg"></div>
<div class="stars" id="stars"></div>

<main class="card">

<div class="logo-text">
<span style="color:#ff4081">M</span>
<span style="color:#00ffcc">A</span>
<span style="color:#4facfe">S</span>
<span style="color:#ffdd00">T</span>
<span style="color:#ff6b9d">E</span>
<span style="color:#9c27ff">R</span>
<span style="color:#ff6b00">4</span>
<span style="color:#00d4ff">0</span>
<span style="color:#ff4b91">4</span>
</div>

<div class="avatar-wrapper">
<div class="avatar-glow"></div>
<img src="./assets/avatar.png" alt="Abdul Hakim">
</div>

<h1>Abdul Hakim</h1>
<p class="subtitle">Developer • Content Creator • Tech Enthusiast</p>

<div class="links" id="links"></div>

<footer>Made with ❤️ by MASTER404</footer>
</main>

<button class="music-btn" id="musicBtn">
<i class="fas fa-music"></i>
</button>

<audio id="bgMusic" loop>
<source src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3">
</audio>

<script>
const links=[
{t:"Facebook",u:"https://facebook.com/Abdulhakimbd16",i:"fab fa-facebook-f"},
{t:"Instagram",u:"https://instagram.com/Abdulhakimbd16",i:"fab fa-instagram"},
{t:"TikTok",u:"https://www.tiktok.com/@abdul.hakim.69",i:"fab fa-tiktok"},
{t:"YouTube",u:"https://www.youtube.com/@AbdulHakimTech",i:"fab fa-youtube"},
{t:"GitHub",u:"https://github.com/master-404",i:"fab fa-github"},
{t:"Telegram",u:"https://t.me/AbdulHakimbd0",i:"fab fa-telegram"},
{t:"WhatsApp",u:"https://wa.me/971589391569",i:"fab fa-whatsapp"},
{t:"LinkedIn",u:"https://www.linkedin.com/in/abdul-hakim-4953b6396/",i:"fab fa-linkedin-in"},
];

const c=document.getElementById("links");
links.forEach(l=>{
const a=document.createElement("a");
a.href=l.u;
a.target="_blank";
a.rel="noopener noreferrer";
a.className="link-btn";
a.innerHTML=`<i class="${l.i} link-icon"></i><span class="link-title">${l.t}</span>`;
c.appendChild(a);
});

const s=document.getElementById("stars");
for(let i=0;i<30;i++){
const d=document.createElement("div");
d.className="star";
d.style.left=Math.random()*100+"%";
d.style.top=Math.random()*100+"%";
s.appendChild(d);
}

const m=document.getElementById("bgMusic");
const b=document.getElementById("musicBtn");
let p=false;
b.onclick=()=>{
p?m.pause():m.play().catch(()=>{});
b.innerHTML=p?'<i class="fas fa-music"></i>':'<i class="fas fa-pause"></i>';
p=!p;
};
</script>

</body>
</html>
