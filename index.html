<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER404 | Abdul Hakim</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Outfit',sans-serif;
background:#0b0f1a;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#fff
}

/* BACKGROUND (STATIC PREMIUM) */
.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,#1e3a8a66,transparent 55%),
radial-gradient(circle at bottom right,#6d28d966,transparent 55%);
z-index:0
}

/* CARD */
.card{
z-index:2;
background:rgba(15,18,35,.9);
backdrop-filter:blur(16px);
padding:45px;
border-radius:28px;
max-width:460px;
width:100%;
text-align:center;
border:1px solid rgba(99,102,241,.25)
}

/* LOGO – ONLY ANIMATION */
.logo span{
font-size:44px;
font-weight:800;
display:inline-block;
color:#c7d2fe;
animation:logoFloat 3s ease-in-out infinite;
}
.logo span:nth-child(even){animation-delay:.3s}

@keyframes logoFloat{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-8px)}
}

/* AVATAR (STATIC) */
.avatar{
width:140px;
height:140px;
margin:22px auto;
border-radius:50%;
padding:4px;
background:linear-gradient(135deg,#6366f1,#8b5cf6)
}
.avatar img{
width:100%;
height:100%;
border-radius:50%;
object-fit:cover;
border:3px solid #0b0f1a
}

/* TEXT */
h1{font-size:28px;margin-top:10px}
.subtitle{
opacity:.7;
margin-bottom:28px;
font-size:14px
}

/* LINKS – PREMIUM COLORS */
.links{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px
}
.link{
padding:14px 10px;
border-radius:14px;
background:linear-gradient(135deg,#1e293b,#020617);
border:1px solid rgba(99,102,241,.35);
text-decoration:none;
color:#e5e7eb;
transition:.35s;
font-size:13px;
}
.link i{
display:block;
font-size:24px;
margin-bottom:6px;
color:#a5b4fc
}
.link:hover{
background:linear-gradient(135deg,#6366f1,#8b5cf6);
color:#fff;
transform:translateY(-4px)
}
.link:hover i{color:#fff}

/* FOOTER */
footer{
margin-top:26px;
font-size:12px;
opacity:.4
}

/* MUSIC BUTTON */
.music{
position:fixed;
bottom:22px;
right:22px;
width:56px;
height:56px;
border-radius:50%;
background:linear-gradient(135deg,#6366f1,#8b5cf6);
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
cursor:pointer;
color:#fff;
z-index:999;
transition:.3s;
}
.music:hover{
transform:scale(1.1);
}

@media(max-width:600px){
.links{grid-template-columns:repeat(2,1fr)}
.card{padding:35px 25px}
}
@media(max-width:400px){
.links{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="card">

<div class="logo">
<span>M</span><span>A</span><span>S</span><span>T</span><span>E</span><span>R</span><span>4</span><span>0</span><span>4</span>
</div>

<div class="avatar">
<img src="1763026669531.png"
     onerror="this.src='https://via.placeholder.com/150'"
     alt="Abdul Hakim">
</div>

<h1>Abdul Hakim</h1>
<p class="subtitle">Developer • Content Creator • Tech Enthusiast</p>

<div class="links">
<a class="link" href="https://facebook.com/Abdulhakimbd16" target="_blank"><i class="fab fa-facebook-f"></i>Facebook</a>

</div>

<footer>Made with ❤️ by MASTER404</footer>

</div>

<div class="music" id="musicBtn">
<i class="fas fa-music"></i>
</div>

<audio id="music" loop>
<source src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3">
</audio>

<script>
const btn=document.getElementById("musicBtn");
const music=document.getElementById("music");
let play=false;
btn.onclick=()=>{
play?music.pause():music.play().catch(()=>{});
btn.innerHTML=play?'<i class="fas fa-music"></i>':'<i class="fas fa-pause"></i>';
play=!play;
};
</script>

</body>
</html>
