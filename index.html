
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdul Hakim - Bio Link</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Cyber Backgrounds */
        .cyber-bg {
            position: fixed;
            width: 100%; height: 100%;
            top: 0; left: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 75, 145, 0.3), transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(0, 245, 212, 0.2), transparent 50%);
            z-index: 0;
        }
        
        .grid-bg {
            position: fixed;
            width: 100%; height: 100%;
            top: 0; left: 0;
            background-image: 
                linear-gradient(rgba(79, 172, 254, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79, 172, 254, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .stars { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 2; pointer-events: none; }
        .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; animation: twinkle 3s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

        /* Main Card */
        main.card {
            background: rgba(15, 15, 35, 0.85);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 40px;
            text-align: center;
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 3;
            border: 1px solid rgba(79, 172, 254, 0.3);
            animation: cardGlow 3s ease-in-out infinite;
        }
        
        @keyframes cardGlow {
            0%, 100% { box-shadow: 0 20px 80px rgba(79, 172, 254, 0.3); }
            50% { box-shadow: 0 20px 100px rgba(255, 75, 145, 0.4); }
        }
        
        .logo-text {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 5px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #4facfe, #ff4b91);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        /* Profile Section */
        .avatar-wrapper { position: relative; display: inline-block; margin-bottom: 20px; }
        .avatar-glow {
            position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%; background: linear-gradient(45deg, #4facfe, #ff4b91);
            animation: rotate 3s linear infinite; filter: blur(5px);
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .avatar-wrapper img {
            width: 150px; height: 150px; border-radius: 50%;
            border: 4px solid #000; position: relative; z-index: 1; object-fit: cover;
        }

        h1#profileName { color: #fff; font-size: 32px; margin-bottom: 5px; }
        p.subtitle { color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 30px; }

        /* Links Grid */
        .links { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .link-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(79, 172, 254, 0.3);
            border-radius: 15px; padding: 15px;
            text-decoration: none; color: #fff;
            transition: 0.3s; display: flex; flex-direction: column; align-items: center;
            cursor: pointer;
        }
        .link-btn:hover { transform: translateY(-5px); background: rgba(79, 172, 254, 0.2); border-color: #4facfe; }
        .link-icon { font-size: 24px; margin-bottom: 8px; }
        .link-title { font-size: 14px; font-weight: 700; }
        .link-subtitle { font-size: 10px; opacity: 0.6; }

        footer { margin-top: 30px; color: rgba(255,255,255,0.3); font-size: 12px; }

        @media(max-width:480px) {
            .links { grid-template-columns: 1fr; }
            main.card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="cyber-bg"></div>
<div class="grid-bg"></div>
<div class="stars" id="starsContainer"></div>

<main class="card">
    <h2 class="logo-text">MASTER404</h2>
    
    <div class="avatar-wrapper">
        <div class="avatar-glow"></div>
        <img src="1763026669531.png" alt="Abdul Hakim">
    </div>
    
    <h1 id="profileName">Abdul Hakim</h1>
    <p class="subtitle">Python Developer • Content Creator</p>
    
    <div class="links" id="linksContainer"></div>
    
    <footer>Made with ❤️ by MASTER404</footer>
</main>

<audio id="bgMusic" loop>
    <source src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3" type="audio/mpeg">
</audio>
<audio id="clickSound">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-click-release-yee-1123.mp3" type="audio/mpeg">
</audio>

<script>
const siteData = {
    links: [
        {title: 'Facebook', url: 'https://facebook.com/Abdulhakimbd16', icon: 'fab fa-facebook-f', subtitle: 'Follow Me', class: 'facebook'},
        {title: 'YouTube', url: 'https://www.youtube.com/@YourChannel', icon: 'fab fa-youtube', subtitle: 'Subscribe', class: 'youtube'},
        {title: 'GitHub', url: 'https://github.com/master-404', icon: 'fab fa-github', subtitle: 'Projects', class: 'github'},
        {title: 'WhatsApp', url: 'https://wa.me/9710589391569', icon: 'fab fa-whatsapp', subtitle: 'Chat', class: 'whatsapp'},
        {title: 'LinkedIn', url: 'https://www.linkedin.com/in/abdul-hakim-4953b6396/', icon: 'fab fa-linkedin-in', subtitle: 'Connect', class: 'linkedin'},
        {title: 'Telegram', url: 'https://t.me/AbdulHakimbd0', icon: 'fab fa-telegram-plane', subtitle: 'Join', class: 'telegram'}
    ]
};

// Stars Creation
const starsContainer = document.getElementById('starsContainer');
for(let i=0; i<30; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    starsContainer.appendChild(star);
}

const container = document.getElementById('linksContainer');
const bgMusic = document.getElementById('bgMusic');
const clickSound = document.getElementById('clickSound');

// Render Links with Click Sound
siteData.links.forEach(link => {
    const a = document.createElement('a');
    a.className = `link-btn ${link.class}`;
    a.href = link.url;
    a.target = '_blank';
    a.innerHTML = `
        <i class="${link.icon} link-icon"></i>
        <span class="link-title">${link.title}</span>
        <span class="link-subtitle">${link.subtitle}</span>
    `;
    
    a.addEventListener('click', () => {
        clickSound.currentTime = 0;
        clickSound.play();
    });
    
    container.appendChild(a);
});

// Background Music Auto-play on first interaction
document.addEventListener('click', () => {
    bgMusic.volume = 0.3;
    bgMusic.play();
}, { once: true });

</script>
</body>
</html>
